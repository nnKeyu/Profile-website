<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版面工作室 · Keyu Mao</title><link rel="stylesheet" href="studio.css">
<header><b class="mark">Km.</b><div><strong>版面工作室</strong><small>KEYU MAO · LAYOUT STUDIO</small></div><span id="status" role="status">正在打开…</span><button id="undo">↶ 撤销</button><button id="imp">导入</button><button id="exp">导出</button><button id="preview" class="primary">预览 ↗</button></header>
<main><section class="desk"><div class="bar"><select id="pages" aria-label="当前页面"></select><button id="rename">重命名</button><button id="addPage">＋ 新页</button><span id="zoom"></span></div><div class="viewport"><div id="frame"><div id="canvas"></div></div></div><footer>拖动元素移动 · 右下角缩放 · 顶部圆点旋转 · 双击文字编辑</footer></section>
<aside><h2>素材库 <small>全页共享</small></h2><button id="upload">↑ 上传图片</button><input id="files" type="file" multiple accept="image/png,image/jpeg,image/webp,image/gif" hidden><div id="assets"></div><hr><h2>文字</h2><button id="addText">＋ 添加文字</button><button id="edit">编辑所选文字</button><hr><h2>图层 <small>上方优先显示</small></h2><div id="layers"></div></aside></main><input type="file" accept=".json" id="projectFile" hidden>
<dialog id="dialog"><form method="dialog"><label id="label" for="entry"></label><textarea id="entry" rows="4" required></textarea><div><button value="cancel" formnovalidate>取消</button> <button value="ok" class="primary">保存</button></div></form></dialog><script src="seed.js"></script><script src="studio.js"></script></html>
